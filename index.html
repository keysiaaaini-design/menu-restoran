```html
<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Pengaturan dasar halaman -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MenuKu | Cafe Digital</title>

    <!-- Menghubungkan file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Menu<span>Ku.</span></h1>
        <p>Menu Digital Cafe dan Resto</p>
    </header>

    <!-- Bagian pencarian menu -->
    <section class="container">
        <h2>Daftar Menu</h2>

        <input
            type="search"
            id="search"
            placeholder="Cari makanan atau minuman..."
        >

        <!-- Filter kategori -->
        <div class="categories">
            <button data-category="Semua" class="active">Semua</button>
            <button data-category="Makanan">Makanan</button>
            <button data-category="Camilan">Camilan</button>
            <button data-category="Minuman">Minuman</button>
        </div>

        <!-- Daftar menu dibuat otomatis oleh JavaScript -->
        <div id="menu-list" class="menu-grid"></div>
    </section>

    <!-- Keranjang belanja -->
    <section class="container cart-section">
        <h2>Keranjang Pesanan</h2>

        <div id="cart-list">
            <p>Belum ada pesanan.</p>
        </div>

        <!-- Total harga -->
        <div class="total">
            <span>Total Pembayaran:</span>
            <strong id="total-price">Rp0</strong>
        </div>

        <!-- Informasi pelanggan -->
        <label for="customer-name">Nama Pemesan</label>
        <input
            type="text"
            id="customer-name"
            placeholder="Masukkan nama"
        >

        <label for="order-note">Catatan</label>
        <textarea
            id="order-note"
            placeholder="Contoh: tidak pedas"
        ></textarea>

        <button id="reset-cart" class="reset-button">
            Kosongkan Keranjang
        </button>

        <button id="order-button" class="order-button">
            Pesan melalui WhatsApp
        </button>

        <p class="info">
            Perhitungan harga dapat digunakan secara offline.
            Pengiriman pesanan melalui WhatsApp membutuhkan internet.
        </p>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 MenuKu. Menu Digital Cafe.</p>
    </footer>

    <!-- Menghubungkan JavaScript -->
    <script src="script.js"></script>
</body>
</html>
```
